  /api/cron/file-promote:
    get:
      summary: "Cron file-promote (GET)"
      operationId: cron_file_promote_get
      tags: [Cron]
      x-response-time-ms: 10000
      security: 
        - cronBearer: []
      responses:
        "200":
          description: response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CronResult"
        "401":
          description: "missing/invalid secret"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorJson"
  /api/cron/file-promote:
    post:
      summary: "Cron file-promote (POST)"
      operationId: cron_file_promote_post
      tags: [Cron]
      x-response-time-ms: 10000
