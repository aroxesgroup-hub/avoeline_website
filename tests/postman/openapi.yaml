              schema:
                $ref: "#/components/schemas/CronResult"
        "401":
          description: "missing/invalid secret"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorJson"
  /api/cron/linked-files:
    get:
      summary: "Cron linked-files (GET)"
      operationId: cron_linked_files_get
      tags: [Cron]
      x-response-time-ms: 10000
      security: 
        - cronBearer: []
      responses:
        "200":
          description: response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CronResult"
        "401":
          description: "missing/invalid secret"
          content:
