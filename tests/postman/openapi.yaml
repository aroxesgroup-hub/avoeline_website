  /api/cron/connections-health:
    get:
      summary: "Cron connections-health (GET)"
      operationId: cron_connections_health_get
      tags: [Cron]
      x-response-time-ms: 10000
      security: 
        - cronBearer: []
      responses:
        "200":
          description: response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CronResult"
        "401":
