    get:
      summary: "Cron feature-override-expiry (GET)"
      operationId: cron_feature_override_expiry_get
      tags: [Cron]
      x-response-time-ms: 10000
      security: 
        - cronBearer: []
      responses:
        "200":
          description: response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CronResult"
        "401":
          description: "missing/invalid secret"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorJson"
  /auth/callback:
    get:
      summary: "Supabase auth callback"
      operationId: getAuthCallback
      tags: [Auth]
      x-response-time-ms: 2000
      security: []
      responses:
        "302":
          description: "redirect"
        "400":
          description: "missing code"
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: header
      name: Cookie
      description: Supabase session cookie string (placeholder env cookie_*).
    cronBearer:
      type: http
      scheme: bearer
      description: CRON_SECRET
  schemas:
    HealthResponse:
      type: "object"
      required:
        - "ok"
        - "appEnv"
        - "timestamp"
        - "requestId"
      properties:
        ok:
          type: "boolean"
          enum:
            - true
        appEnv:
          type: "string"
          enum:
            - "local"
            - "staging"
            - "production"
        timestamp:
          type: "string"
          format: "date-time"
        requestId:
          type: "string"
    ErrorJson:
      type: "object"
      properties:
        error:
          type: "string"
        ok:
          type: "boolean"
        message:
          type: "string"
    UploadSessionBody:
      type: "object"
      required:
        - "eventId"
        - "fileName"
        - "mime"
        - "size"
        - "category"
      properties:
        eventId:
          type: "string"
          format: "uuid"
        fileName:
          type: "string"
          minLength: 1
          maxLength: 200
        mime:
          type: "string"
          minLength: 3
          maxLength: 120
        size:
          type: "integer"
          minimum: 1
          maximum: 209715200
        category:
          type: "string"
          enum:
            - "payment_proof"
            - "submission"
            - "media"
            - "certificate"
            - "export"
            - "other"
        folderKind:
          type: "string"
          enum:
            - "payment_proofs"
            - "certificates"
            - "media"
            - "exports"
            - "submissions"
        entityType:
          type: "string"
        entityId:
          type: "string"
        registrationId:
          type: "string"
          format: "uuid"
      example:
        eventId: "00000000-0000-4000-8000-000000000001"
        fileName: "slide.pdf"
        mime: "application/pdf"
        size: 1024
        category: "media"
    UploadCompleteBody:
      type: "object"
      required:
        - "eventId"
        - "providerFileId"
        - "fileName"
        - "mime"
        - "size"
        - "category"
        - "folderKind"
      properties:
        eventId:
          type: "string"
          format: "uuid"
        providerFileId:
          type: "string"
          minLength: 5
          maxLength: 128
        fileName:
          type: "string"
        mime:
          type: "string"
        size:
          type: "integer"
          minimum: 0
          maximum: 209715200
        category:
          type: "string"
          enum:
            - "payment_proof"
            - "submission"
            - "media"
            - "certificate"
            - "export"
            - "other"
        folderKind:
          type: "string"
          enum:
            - "payment_proofs"
            - "certificates"
            - "media"
            - "exports"
            - "submissions"
        connectionId:
          type: "string"
          format: "uuid"
      example:
        eventId: "00000000-0000-4000-8000-000000000001"
        providerFileId: "drive-file-id-xxxxx"
        fileName: "slide.pdf"
        mime: "application/pdf"
        size: 1024
        category: "media"
        folderKind: "media"
    ProofUploadResponse:
      type: "object"
      required:
        - "fileId"
      properties:
        fileId:
          type: "string"
    CertificateJson:
      type: "object"
      required:
        - "templateLayout"
        - "version"
        - "assets"
        - "data"
      properties:
        templateLayout: {}
        version: {}
        assets: {}
        data: {}
    CronResult:
      type: "object"
      additionalProperties: true
      properties:
        ok:
          type: "boolean"

