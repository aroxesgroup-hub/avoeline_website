openapi: 3.1.0
info:
  title: Avoeline API
  version: "1.0.0"
  description: |
    HTTP Route Handlers for Avoeline (docs/25 T1).
    Request bodies for uploads mirror zod in tests/postman/schemas/http.mjs
    (kept aligned with src/app/api/uploads/*/route.ts).
    Server Actions are out of scope for this OpenAPI surface.
servers:
  - url: "{baseUrl}"
    variables:
      baseUrl:
        default: http://127.0.0.1:3000
tags:
  - name: Health
  - name: Certificates
  - name: FilesUploads
  - name: Connections
  - name: Cron
  - name: Auth
  - name: PublicEvent
paths:
  /api/health:
    get:
      summary: "Liveness"
      operationId: getHealth
      tags: [Health]
      x-response-time-ms: 1000
      security: []
      responses:
        "200":
          description: response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /api/events/{eventId}/calendar.ics:
    get:
      summary: "Public calendar ICS"
      operationId: getEventCalendarIcs
      tags: [PublicEvent]
      x-response-time-ms: 2000
      security: []
      parameters:
        - name: eventId
          in: path
          required: true
          schema: { type: string }
          example: "{{eventId}}"
      responses:
        "200":
          description: "text/calendar"
        "404":
          description: "not found"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorJson"
  /api/qr/{token}:
    get:
      summary: "Check-in QR (token)"
      operationId: getQrToken
      tags: [PublicEvent]
      x-response-time-ms: 2000
      security: []
      parameters:
        - name: token
          in: path
          required: true
          schema: { type: string }
          example: "{{qrToken}}"
      responses:
        "200":
          description: "image or redirect"
        "400":
          description: "bad token"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorJson"
  /api/certificates/{id}:
    get:
      summary: "Issued certificate JSON"
      operationId: getCertificateJson
      tags: [Certificates]
      x-response-time-ms: 2000
      security: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
          example: "{{certificateId}}"
      responses:
        "200":
          description: response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CertificateJson"
        "404":
          description: "not found"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorJson"
        "429":
          description: "rate limited"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorJson"
  /certificate/{code}/download:
    get:
      summary: "Certificate PDF download"
      operationId: getCertificatePdf
      tags: [Certificates]
      x-response-time-ms: 2000
      security: []
      parameters:
        - name: code
          in: path
          required: true
          schema: { type: string }
          example: "{{certificateCode}}"
      responses:
        "200":
          description: "application/pdf"
        "404":
          description: "not found"
  /api/files/{id}:
    get:
      summary: "Private file proxy"
      operationId: getFile
      tags: [FilesUploads]
      x-response-time-ms: 2000
      security: 
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
          example: "{{fileId}}"
      responses:
        "200":
          description: "file bytes"
        "401":
          description: "unauthorized"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorJson"
        "403":
          description: "forbidden"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorJson"
  /api/uploads/proof:
    post:
      summary: "Public payment proof upload"
      operationId: postUploadProof
      tags: [FilesUploads]
      x-response-time-ms: 2000
      security: []
      responses:
        "200":
          description: response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProofUploadResponse"
        "400":
          description: "validation"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorJson"
        "429":
          description: "rate limited"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorJson"
  /api/uploads/session:
    post:
      summary: "Resumable Drive upload session"
      operationId: postUploadSession
      tags: [FilesUploads]
      x-response-time-ms: 2000
      security: 
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UploadSessionBody"
      responses:
        "200":
          description: "session url"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CronResult"
        "401":
          description: "sign in"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorJson"
  /api/uploads/complete:
    post:
      summary: "Finalize resumable upload"
      operationId: postUploadComplete
      tags: [FilesUploads]
      x-response-time-ms: 2000
      security: 
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UploadCompleteBody"
      responses:
        "200":
          description: "stored file"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CronResult"
        "401":
          description: "sign in"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorJson"
  /api/admin/picker-diagnostics:
    get:
      summary: "Picker env diagnostics"
      operationId: getPickerDiagnostics
      tags: [Connections]
      x-response-time-ms: 2000
      security: 
        - cookieAuth: []
      responses:
        "200":
          description: "flags"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CronResult"
        "401":
          description: "unauthorized"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorJson"
        "403":
          description: "forbidden"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorJson"
  /api/connections/{provider}/start:
    get:
      summary: "OAuth start"
      operationId: getConnectionStart
      tags: [Connections]
      x-response-time-ms: 2000
      security: 
        - cookieAuth: []
      parameters:
        - name: provider
          in: path
          required: true
          schema: { type: string }
          example: "google"
        - name: capability
          in: query
          required: false
          schema: { type: string }
          example: "email.send"
      responses:
        "302":
          description: "redirect to provider"
        "401":
          description: "sign in redirect"
  /api/connections/{provider}/callback:
    get:
      summary: "OAuth callback"
      operationId: getConnectionCallback
      tags: [Connections]
      x-response-time-ms: 2000
      security: 
        - cookieAuth: []
      parameters:
        - name: provider
          in: path
          required: true
          schema: { type: string }
          example: "google"
      responses:
        "302":
          description: "redirect"
        "401":
          description: "sign in"
  /api/connections/google/picker-token:
    get:
      summary: "Google Picker token"
      operationId: getPickerToken
      tags: [Connections]
      x-response-time-ms: 2000
      security: 
        - cookieAuth: []
      parameters:
        - name: connectionId
          in: query
          required: true
          schema: { type: string }
          example: "{{connectionId}}"
      responses:
        "200":
          description: "token payload"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CronResult"
        "401":
          description: "unauthorized"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorJson"
  /api/connections/google/picker-token:
    post:
      summary: "Google Picker token (POST)"
      operationId: postPickerToken
      tags: [Connections]
      x-response-time-ms: 2000
      security: 
        - cookieAuth: []
      responses:
        "400":
          description: "missing connectionId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorJson"
        "401":
          description: "unauthorized"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorJson"
  /api/email/google/callback:
    get:
      summary: "Legacy Google email OAuth redirect"
      operationId: getLegacyEmailGoogleCallback
      tags: [Connections]
      x-response-time-ms: 2000
      security: []
      responses:
        "302":
          description: "redirect to connections callback"
  /api/cron/plan-expiry:
    get:
      summary: "Cron plan-expiry (GET)"
      operationId: cron_plan_expiry_get
      tags: [Cron]
      x-response-time-ms: 10000
      security: 
        - cronBearer: []
      responses:
        "200":
          description: response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CronResult"
        "401":
          description: "missing/invalid secret"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorJson"
  /api/cron/plan-expiry:
    post:
      summary: "Cron plan-expiry (POST)"
      operationId: cron_plan_expiry_post
      tags: [Cron]
      x-response-time-ms: 10000
      security: 
