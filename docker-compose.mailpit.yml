# Deprecated path — prefer root docker-compose.yml (docs/25 T0).
# Usage: docker compose -f docker-compose.mailpit.yml up -d
# Or:    npm run mailpit  (uses docker-compose.yml)
# UI: http://localhost:8025  SMTP: localhost:1025
services:
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025"
      - "8025:8025"
    restart: unless-stopped
