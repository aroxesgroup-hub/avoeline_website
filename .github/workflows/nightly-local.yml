name: Nightly security + k6 smoke

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

env:
  NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
  NEXT_PUBLIC_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.placeholderplaceholderplaceholder
  SUPABASE_SERVICE_ROLE_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.service-role-placeholderxx
  HACKATHON_COMPETE_SECRET: ci-hackathon-compete-secret
  NEXT_TELEMETRY_DISABLED: "1"
  APP_ENV: local
  BASE_URL: http://127.0.0.1:3000
  TEST_HOST_ALLOWLIST: localhost,127.0.0.1

jobs:
  nightly:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - name: Install k6
        run: |
          sudo gpg -k
          sudo gpg --no-default-keyring --keyring /usr/share/keyrings/k6-archive-keyring.gpg --keyserver hkp://keyserver.ubuntu.com:80 --recv-keys C5AD17C747E83913004B06FC9AFC28129C25C9B0
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update
          sudo apt-get install -y k6
          k6 version
      - name: Security unit
        run: npm run test:security:unit
      - name: Security deps (soft-skip missing tools)
        run: npm run test:security:deps
      - name: Build
        run: npm run build
      - name: Start app
        run: |
          npm run start &
          echo $! > /tmp/next-pid
          for i in $(seq 1 60); do
            if curl -sf -o /dev/null http://127.0.0.1:3000/events; then exit 0; fi
            sleep 2
          done
          echo "server did not become ready"
          exit 1
      - name: Transport + authz + Postman
        run: |
          npm run test:security:transport
          npm run test:security:authz
          npm run test:security:postman
      - name: ZAP (soft-skip without Docker)
        run: npm run test:security:zap
        continue-on-error: true
      - name: k6 smoke (optional secrets)
        env:
          EVENT_ID: ${{ secrets.EVENT_ID }}
          LOAD_BASE_URL: ${{ secrets.LOAD_BASE_URL }}
        run: |
          mkdir -p reports/load
          if [ -z "${EVENT_ID}" ]; then
            echo '{"executed":false,"reason":"EVENT_ID secret not set — soft-skip k6"}' > reports/load/status.json
            echo "::notice::k6 soft-skipped (set EVENT_ID + optional LOAD_BASE_URL secrets)"
            exit 0
          fi
          export BASE_URL="${LOAD_BASE_URL:-http://127.0.0.1:3000}"
          npm run test:load:reads
      - name: Stop app
        if: always()
        run: |
          if [ -f /tmp/next-pid ]; then kill $(cat /tmp/next-pid) || true; fi
      - name: Upload nightly reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-reports
          path: |
            reports/security/**
            reports/load/**
          if-no-files-found: ignore
